<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&amp;family=Noto+Sans+SC:wght@400&amp;family=Marcellus&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Noto Sans SC', sans-serif; background: #FBF8F1; }
    a { color: #2E7D4F; } a:hover { color: #1F6B3C; }
  </style>
</helmet>
<div style="--green: {{green}}; --yellow: {{yellow}}; width: 560px; height: 520px; box-sizing: border-box; background: #FBF8F1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; position: relative">
  <span style="position: absolute; top: 20px; left: 24px; font-size: 12px; color: #B0A88F; letter-spacing: 2px">方案 B · 字标</span>
  <div style="position: relative; display: inline-block">
    <div style="font-family: 'Noto Serif SC', serif; font-size: 100px; font-weight: 700; color: var(--green); letter-spacing: 14px; line-height: 1.15; text-indent: 14px">培芽</div>
    <svg viewBox="0 0 70 70" width="66" height="66" style="position: absolute; top: -44px; right: 24px">
      <path d="M35,66 C35,52 35,46 35,32" style="fill: none; stroke: var(--green); stroke-width: 5; stroke-linecap: round"></path>
      <path d="M35,40 C31,25 20,17 7,16 C9,32 20,42 35,40 Z" style="fill: var(--green)"></path>
      <path d="M35,46 C39,33 48,26 61,25 C60,41 48,49 35,46 Z" style="fill: var(--yellow)"></path>
    </svg>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 7px">
    <div style="font-size: 17px; color: #2B3A2E; letter-spacing: 10px; text-indent: 10px">教 育</div>
    <div style="font-family: Marcellus, serif; font-size: 13px; color: #8A8371; letter-spacing: 4px; text-indent: 4px">PEIYA EDUCATION</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"green":{"editor":"color","default":"#2E7D4F","options":["#2E7D4F","#3E8E5A","#55A860","#1F6B3C"],"section":"配色"},"yellow":{"editor":"color","default":"#F5C542","options":["#F5C542","#F2B705","#FFD666","#E8A93D"],"section":"配色"},"$preview":{"width":560,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      green: this.props.green ?? '#2E7D4F',
      yellow: this.props.yellow ?? '#F5C542'
    };
  }
}
</script>
</body>
</html>
